name: Feature request
description: Propose a new feature or improvement for MobARK
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature! Please check the
        [open issues](https://github.com/suwasto/MobARK/issues) first, and keep the
        project's constraints in mind: **local-first** (no data leaves the
        machine by default) and the **Apache-2.0 posture** (permissive-only
        imported libraries; GPL/LGPL tools subprocess-only).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The concrete pain point or use case, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see built, at whatever level of detail you have.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Anything you tried or considered instead.
  - type: dropdown
    id: scope
    attributes:
      label: Area (if known)
      options:
        - Analysis (Android/iOS)
        - Agent / AI Agent
        - Edit & recompile
        - Reports
        - Auth / isolation
        - Dashboard / frontend
        - Docs / repo
        - Other
