# Alembic configuration for MobARK.
# The SQLAlchemy URL is set from MobARK settings in alembic/env.py
# (honors MOBARK_DATABASE_URL, so it works identically in Docker and locally).

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally overridden in env.py
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
