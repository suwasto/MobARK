# MASA-curated Semgrep rules for decompiled Android Java/Kotlin code.
# Rule ids are stable so findings can be tracked across rule updates.
# Messages embed "[MASVS-<CONTROL>]" so the normalizer can set the category.
rules:
  - id: masa-android-webview-javascript-enabled
    languages: [java]
    # Owner calibration (Aug 7): JS enabled in a WebView that can load
    # remote/attacker content is a script-injection / potential RCE surface.
    severity: ERROR
    message: >
      [MASVS-PLATFORM-3] WebView has JavaScript enabled
      (setJavaScriptEnabled(true)). This exposes the app to JavaScript
      injection if the WebView loads remote or attacker-influenced content.
    patterns:
      - pattern: $W.setJavaScriptEnabled(true)

  - id: masa-android-webview-file-access
    languages: [java]
    # Owner calibration (Aug 7): local file read/disclosure surface.
    severity: ERROR
    message: >
      [MASVS-PLATFORM-3] WebView allows file/universal file access, which can
      let remote content read local files.
    pattern-either:
      - pattern: $W.setAllowFileAccess(true)
      - pattern: $W.setAllowUniversalAccessFromFileURLs(true)
      - pattern: $W.setAllowFileAccessFromFileURLs(true)

  - id: masa-android-cleartext-http-url
    languages: [java]
    severity: WARNING
    message: >
      [MASVS-NETWORK-1] Hardcoded cleartext HTTP URL detected; traffic to it
      is unencrypted.
    pattern-either:
      - pattern: new URL("http://$REST")
      - pattern: new URL('http://$REST')

  - id: masa-android-all-hostname-verifier
    languages: [java]
    severity: ERROR
    message: >
      [MASVS-NETWORK-3] Hostname verification disabled via
      ALLOW_ALL_HOSTNAME_VERIFIER / null HostnameVerifier — MITM risk.
    pattern-either:
      - pattern: ALLOW_ALL_HOSTNAME_VERIFIER
      - pattern: $H.setHostnameVerifier(null)

  - id: masa-android-insecure-trust-manager
    languages: [java]
    severity: ERROR
    message: >
      [MASVS-NETWORK-3] Custom X509TrustManager with empty
      checkServerTrusted — certificate validation disabled.
    patterns:
      - pattern: |
          class $TM implements X509TrustManager {
            ...
            public void checkServerTrusted(...) { }
            ...
          }

  - id: masa-android-hardcoded-secret-key
    languages: [java]
    # Owner calibration (Aug 7): hardcoded key material (MASVS-CRYPTO-1).
    severity: ERROR
    message: >
      [MASVS-CRYPTO-1] Hardcoded key material passed to SecretKeySpec —
      keys must come from the Android Keystore, not source code.
    patterns:
      - pattern: new SecretKeySpec($KEY, $ALGO)

  - id: masa-android-weak-cipher
    languages: [java]
    # Owner calibration (Aug 7): broken ciphers (DES/RC4/MD5/RSA-ECB).
    severity: ERROR
    message: >
      [MASVS-CRYPTO-2] Weak or broken cipher algorithm usage detected.
    pattern-either:
      - pattern: Cipher.getInstance("DES/$REST")
      - pattern: Cipher.getInstance("RC4/$REST")
      - pattern: Cipher.getInstance("MD5/$REST")
      - pattern: Cipher.getInstance("RSA/ECB/$REST")

  - id: masa-android-insecure-random
    languages: [java]
    severity: WARNING
    message: >
      [MASVS-CRYPTO-2] java.util.Random used for security-sensitive values;
      use SecureRandom instead.
    patterns:
      - pattern: new Random($SEED)
      - pattern: $R.nextBytes($B)
