# mastg-android-non-random-use
#
# Rewritten from scratch (Aug 2026) to clear the GPL-3.0 derivation of the
# previous pattern body, which traced to mindedsecurity/semgrep-rules-android-
# security (rules/crypto/mstg-crypto-6.yaml) via `original_source`. Same
# MASTG-CRYPTO-6 detection intent - time-based sources (Date, currentTime,
# Calendar fields) are predictable, never random - but the pattern expression
# is newly written: the previous method-body wrapper is gone and the matches
# are anchored on the time-source call sites themselves. The id / message /
# summary are MASTG-authored text (CC BY-SA, vendored via scripts/sync_mastg.py).
rules:
  - id: mastg-android-non-random-use
    severity: WARNING
    languages:
      - java
    metadata:
      summary: This rule looks for common patterns including classes and methods that represent non-random sources e.g. via `Calendar.MILLISECOND` or `new Date()`.
    message: "[MASVS-CRYPTO-1] The application makes use of non-random sources."
    pattern-either:
      - pattern: new Date()
      - pattern: System.currentTimeMillis()
      - pattern: $CAL.getTimeInMillis()
      - pattern: $CAL.get(Calendar.MILLISECOND)
