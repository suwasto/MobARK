# MASA — local-first mobile pentest dashboard
# Services: app (FastAPI) + worker (RQ) + redis always-on; searxng is
# PROFILE-GATED (M7) — start it with `docker compose --profile web up -d
# searxng` only when the agent's web research is in use (see the Settings ->
# Search & research tab; the Active toggle never auto-starts the container).
#
# Prerequisites:
#   - Ollama / LM Studio running on the HOST (MASA never bundles an LLM; M3+ connects outward)
#   - Docker with the Compose v2 plugin (or standalone docker-compose)

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      MASA_DATABASE_URL: sqlite:////data/masa.db
      MASA_REDIS_URL: redis://redis:6379/0
      MASA_DATA_DIR: /data
      MASA_LOG_LEVEL: INFO
      # M3: reach the host's LLM servers from inside the container. On Linux
      # this needs the extra_hosts host-gateway mapping below.
      MASA_OLLAMA_BASE_URL: http://host.docker.internal:11434
      MASA_LM_STUDIO_BASE_URL: http://host.docker.internal:1234/v1
      # M7: reach the bundled SearXNG from INSIDE the compose network — the
      # host-published localhost:8888 is not visible in-container (owner
      # report, Aug 9: Connection refused on the seeded default). The search
      # store seeds from this on first read; an existing search_backends.json
      # keeps its own URL (edit it in Settings -> Search & research).
      MASA_SEARXNG_BASE_URL: http://searxng:8080
      # Dev-only fake LLM (M6 follow-up): MASA_FAKE_MODEL=1 seeds the
      # deterministic "fake" backend so the Agent dock's live tool steps +
      # token streaming (incl. the M7 web-research demo) work with zero
      # Ollama. Default off — real installs never see it.
      MASA_FAKE_MODEL: ${MASA_FAKE_MODEL:-0}
      # M4 agent chat: local models (especially thinking models with big
      # findings contexts) are slow — give the tool loop a realistic budget.
      # The per-request payload.timeout_seconds can still override this.
      MASA_CHAT_TIMEOUT_SECONDS: 600
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - masa-data:/data
    ports:
      - "8000:8000"
    # Run migrations, then start the API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # M7 web research: the agent's search engine. AGPL-3.0 boundary — this is
  # the UNMODIFIED upstream image reached only over its HTTP JSON API
  # (GET /search?format=json); the copyleft never crosses the process
  # boundary (see docs/licenses.md). Profile-gated so the default install
  # stays lean. Our minimal settings.yml (json format enabled) is mounted at
  # /etc/searxng/settings.yml — a config artifact we author, not SearXNG code.
  searxng:
    image: searxng/searxng:latest
    profiles: ["web"]
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://localhost:8888
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/etc/searxng
    ports:
      - "8888:8080"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Must match the `app` service: worker and API share the /data DB.
      # (Without this, the worker would default to the image's own ./data
      # dir, splitting the database between services.)
      MASA_DATABASE_URL: sqlite:////data/masa.db
      MASA_REDIS_URL: redis://redis:6379/0
      MASA_DATA_DIR: /data
      MASA_LOG_LEVEL: INFO
      # M3: same host-LLM reachability as the app service.
      MASA_OLLAMA_BASE_URL: http://host.docker.internal:11434
      MASA_LM_STUDIO_BASE_URL: http://host.docker.internal:1234/v1
      # M7: same SearXNG reachability as the app service (the worker can run
      # web-research scans too once the dock opt-in + engine are on).
      MASA_SEARXNG_BASE_URL: http://searxng:8080
      # Dev-only fake LLM — same knob as the app service.
      MASA_FAKE_MODEL: ${MASA_FAKE_MODEL:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - masa-data:/data
    command: python worker.py

volumes:
  masa-data:
  redis-data:
  searxng-data:
