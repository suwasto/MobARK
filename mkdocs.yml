# MobARK public documentation site.
# Docs content lives in the tracked site/docs/ dir (docs/ stays gitignored -
# it holds internal working notes + sample binaries). Build output goes
# to _site/ (gitignored). Deploy: .github/workflows/pages.yml -> GitHub Pages.
site_name: MobARK - Mobile Application Reverse Kit
site_description: Self-hosted mobile application security testing - static analysis + AI Agent for Android and iOS, no data leaves your infrastructure.
site_url: https://suwasto.github.io/MobARK/
repo_url: https://github.com/suwasto/MobARK
repo_name: suwasto/MobARK
edit_uri: edit/main/site/docs/

docs_dir: site/docs
site_dir: _site

theme:
  name: material
  features:
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  logo: assets/mobark_icon_text_desc_whitetext.svg
  favicon: assets/mobark_icon_text_desc_whitetext.svg

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Features: features.md
  - Architecture: architecture.md
  - Authentication: auth.md
  - Status: status.md
  - Demo: demo.md
  - Third-party licenses: licenses.md
